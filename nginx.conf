# nginx config for a.k.a.balanza static blog
# Optimised for static file serving

# Autotunable via NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE=1
# (entrypoint script replaces this line with a CPU-count value)
worker_processes auto;
pid /tmp/nginx.pid;

events {
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Disable access log in favour of error logging only
    access_log    off;
    error_log     /dev/stderr warn;

    # Keepalive
    keepalive_timeout  30;
    keepalive_requests 100;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/xml application/rss+xml text/javascript image/svg+xml;

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        root    /usr/share/nginx/html;
        index   index.html;

        # Security headers (placed at server level, inherited by all locations
        # that don't have their own add_header — see nginx inheritance rule)
        add_header X-Frame-Options         "DENY"               always;
        add_header X-Content-Type-Options  "nosniff"            always;
        add_header X-XSS-Protection        "0"                  always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # Static assets: cache moderately (2 weeks — no content hashing in build)
        # NB: uses `expires` rather than `add_header Cache-Control` to avoid
        # overriding the security headers above (nginx drops all add_header
        # from parent levels when a child has any add_header of its own).
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff2?)$ {
            expires    2w;
        }

        # HTML, XML, RSS: short cache
        location ~* \.(html|xml|rss)$ {
            expires    1h;
        }

        # Allow ACME HTTP-01 challenges (Let's Encrypt) before blocking other dotfiles
        # ^~ stops regex matching, preventing the catch-all below from firing
        location ^~ /.well-known/ {
            try_files $uri =404;
        }

        # Don't serve hidden files (except .well-known which is allowed above)
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
